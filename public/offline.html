<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" />
    <title>PINGO — offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        background: #101820; color: #f5f7f9; font-family: Inter, system-ui, sans-serif;
        padding: 24px; text-align: center;
      }
      img { width: 64px; height: 64px; border-radius: 18px; }
      h1 { margin: 20px 0 8px; font-size: 20px; font-weight: 600; }
      p { margin: 0; max-width: 300px; color: #aab6c0; font-size: 13px; line-height: 1.6; }
      button {
        margin-top: 20px; min-height: 44px; padding: 0 20px; border: 1px solid #293944;
        border-radius: 12px; background: #17232d; color: #f5f7f9; font: inherit; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo192.png" alt="PINGO" />
      <h1>You’re offline</h1>
      <p>PINGO will reconnect when your device is back online. Your drafts stay on this device.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
